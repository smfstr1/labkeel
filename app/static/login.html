<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16202a">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LabKeel">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='5' fill='%2316202A'/%3E%3Crect x='7' y='10' width='18' height='4' rx='2' fill='%236FA8EE'/%3E%3Crect x='7' y='18' width='18' height='4' rx='2' fill='%234CC2AE'/%3E%3Ccircle cx='22' cy='12' r='1.2' fill='%2316202A'/%3E%3Ccircle cx='22' cy='20' r='1.2' fill='%2316202A'/%3E%3C/svg%3E">
<style>
@font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400; font-display: swap; src: url(/assets/hanken-grotesk-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 500; font-display: swap; src: url(/assets/hanken-grotesk-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 600; font-display: swap; src: url(/assets/hanken-grotesk-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 700; font-display: swap; src: url(/assets/hanken-grotesk-latin-700-normal.woff2) format("woff2"); }
:root {
  --bg: #16202A; --panel: #1D2935; --panel-2: #22303E; --rule: #2C3A48; --rule-2: #3A4B5C;
  --text: #E4ECF2; --muted: #8EA0B1; --faint: #62778A; --accent: #6FA8EE; --good: #5BC98A; --warn: #EDB54A; --bad: #EF6A5C; --focus: #9CC6FF;
  --sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEF2F5; --panel: #FFFFFF; --panel-2: #F5F8FA; --rule: #DCE3E9; --rule-2: #C6D0D9;
    --text: #16202A; --muted: #556676; --faint: #7D8D9C; --accent: #2F72C9; --good: #23955A; --warn: #B77B0E; --bad: #CC3B2D; --focus: #2F72C9; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #EEF2F5; --panel: #FFFFFF; --panel-2: #F5F8FA; --rule: #DCE3E9; --rule-2: #C6D0D9;
  --text: #16202A; --muted: #556676; --faint: #7D8D9C; --accent: #2F72C9; --good: #23955A; --warn: #B77B0E; --bad: #CC3B2D; --focus: #2F72C9; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 24px 16px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 26px 24px 22px; }
.host { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; margin-bottom: 18px; }
.host i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
h1 { font-size: 24px; margin: 0 0 18px; letter-spacing: -.01em; }
form { display: flex; flex-direction: column; gap: 14px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--muted); }
input[type=text], input[type=password] { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 8px; padding: 10px 12px; font-size: 16px; }
.pw { position: relative; display: flex; }
.pw input { flex: 1; padding-right: 64px; min-width: 0; }
.pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.pw button:hover { color: var(--text); }
.check { display: flex; align-items: center; gap: 9px; font-size: 14.5px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
button.go { font: inherit; font-weight: 600; background: var(--accent); color: var(--bg); border: 0; border-radius: 8px; padding: 11px; cursor: pointer; margin-top: 4px; }
button.go:hover { background: color-mix(in srgb, var(--accent) 85%, var(--text)); }
button.go[disabled] { opacity: .65; cursor: default; }
button.pk { font: inherit; font-weight: 600; background: none; color: var(--text); border: 1px solid var(--rule, #3a4553); border-radius: 8px; padding: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
button.pk:hover { border-color: var(--accent); }
button.pk[hidden] { display: none; }
.err { color: var(--bad); font-size: 14px; margin: 0; }
.err:empty { display: none; }
.note { font-size: 13px; color: var(--muted); margin: 16px 0 0; display: flex; gap: 8px; align-items: baseline; }
.note b { font-weight: 600; }
.note.warn { color: var(--warn); }
.note::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; transform: translateY(-1px); }
.note.ok::before { background: var(--good); }
</style>
</head>
<body>
<main class="box">
  <div class="host"><i aria-hidden="true"></i><span id="host">LabKeel</span></div>
  <h1>Sign in</h1>
  <form id="f" novalidate>
    <label class="f">Username <input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="f">Password
      <span class="pw"><input type="password" id="p" autocomplete="current-password" required><button type="button" id="show" aria-label="Show password">Show</button></span>
    </label>
    <label class="check"><input type="checkbox" id="r" checked> Keep me signed in for 30 days</label>
    <p class="err" id="err" role="alert"></p>
    <button class="go" type="submit" id="go">Sign in</button>
  </form>
  <button class="pk" type="button" id="pk" hidden>Sign in with a passkey</button>
  <p class="note" id="conn"></p>
</main>
<script>
// The sign-in page: the password form (POST /api/login) and, where a passkey has been added for this
// address, a passkey button. Either sets the session cookie, then it goes back to the page you wanted
// (?next=, which is only ever followed to a path on this same site).
"use strict";
try { const t = localStorage.getItem("hd-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
let next = params.get("next") || "/";
if (!/^\/(?![\/\\])/.test(next) || /[\u0000-\u001f]/.test(next)) next = "/";  // same-site paths only, no "//host" or "/\\host"

fetch("/api/login-info").then(r => r.json()).then(d => {
  if (!d.enabled) return location.replace(next + location.hash);
  if (d.title) { $("#host").textContent = d.title; document.title = `Sign in to ${d.title}`; }
  $("#pk").hidden = !(d.passkeys && window.PublicKeyCredential);
  const c = $("#conn");
  if (d.secure) { c.className = "note ok"; c.textContent = "Your connection to the dashboard is encrypted."; }
  else { c.className = "note warn"; c.innerHTML = "<span><b>This connection isn't encrypted.</b> Your password could be seen by others on the network.</span>"; }
}).catch(() => {});

$("#show").addEventListener("click", () => {
  const p = $("#p"), showing = p.type === "text";
  p.type = showing ? "password" : "text";
  $("#show").textContent = showing ? "Show" : "Hide";
  $("#show").setAttribute("aria-label", showing ? "Show password" : "Hide password");
});

$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("#err"), go = $("#go");
  if (!$("#u").value || !$("#p").value) { err.textContent = "Enter your username and password."; return; }
  err.textContent = ""; go.disabled = true; go.textContent = "Signing in…";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("#u").value, password: $("#p").value, remember: $("#r").checked }) });
    if (r.ok) return location.replace(next + location.hash);
    const j = await r.json().catch(() => ({}));
    err.textContent = j.error || "Couldn't sign in. Try again.";
    $("#p").select();
  } catch { err.textContent = "Can't reach the dashboard. Check your connection and try again."; }
  go.disabled = false; go.textContent = "Sign in";
});
$("#pk").addEventListener("click", async () => {
  const err = $("#err"), b = $("#pk");
  const dec = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0)).buffer;
  const enc = buf => { let s = ""; for (const x of new Uint8Array(buf)) s += String.fromCharCode(x); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  err.textContent = ""; b.disabled = true;
  try {
    const o = await fetch("/api/login/passkey/options", { method: "POST" }).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; });
    const opt = { ...o.options, challenge: dec(o.options.challenge), allowCredentials: (o.options.allowCredentials || []).map(c => ({ ...c, id: dec(c.id) })) };
    const c = await navigator.credentials.get({ publicKey: opt });
    const resp = c.response;
    const credential = { id: c.id, rawId: enc(c.rawId), type: c.type, clientExtensionResults: c.getClientExtensionResults?.() || {}, authenticatorAttachment: c.authenticatorAttachment || null,
      response: { clientDataJSON: enc(resp.clientDataJSON), authenticatorData: enc(resp.authenticatorData), signature: enc(resp.signature), userHandle: resp.userHandle ? enc(resp.userHandle) : null } };
    const r = await fetch("/api/login/passkey", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ticket: o.ticket, credential, remember: $("#r").checked }) });
    if (r.ok) return location.replace(next + location.hash);
    const j = await r.json().catch(() => ({}));
    err.textContent = j.error || "That passkey didn't work.";
  } catch (e) { err.textContent = e.name === "NotAllowedError" ? "The passkey was cancelled or timed out." : e.message; }
  b.disabled = false;
});
$("#u").focus();
</script>
</body>
</html>
