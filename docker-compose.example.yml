# Copy this file to docker-compose.yml, change what's marked, then run:  docker compose up -d --build
# Open https://<this machine's address>:8787 and follow the set-up page. It asks for a one-time code
# from the log:  docker logs labkeel

services:
  labkeel:
    build: .                                  # builds from this folder (docker compose up -d --build)
    # image: ghcr.io/smfstr1/labkeel:latest   # once releases are published: use this line instead of build
    container_name: labkeel
    restart: unless-stopped

    # Why these three are needed:
    #   network_mode: host  shows the machine's real network cards and traffic, not the container's
    #   pid: host           lets it see every process, and restart or shut down the machine if you allow it
    #   privileged: true    lets it read drive health (SMART) and run ZFS and disk commands on the machine
    # Together they give LabKeel full control of this machine. Only give an admin account to someone
    # you'd trust with a root shell on it.
    network_mode: host
    pid: host
    privileged: true

    environment:
      # What LabKeel may change. All three start OFF: turn on only what you need.
      - DASH_FILES_WRITE=0      # 1 = upload, edit, move and delete files in the file browser
      - DASH_ZFS_WRITE=0        # 1 = create, change and destroy ZFS pools, datasets and snapshots
      - DASH_ALLOW_REBOOT=0     # 1 = restart and shut down the machine

      # Accounts are made on the set-up page and the Account page; nothing is needed here.
      # Optionally, one admin set here instead (it can't be changed from the dashboard):
      # - DASH_USER=admin
      # - DASH_PASS_HASH=$$argon2id$$v=19$$...   # from: docker exec -it labkeel python accounts.py hash
      #                                          # (write each $ as $$ in this file)

      # Optional
      # - DASH_PORT=8787
      # - DASH_TLS=auto          # auto | tailscale | self-signed | off (off = plain HTTP behind your own HTTPS
      #                          # proxy, which then needs DASH_TRUSTED_PROXY: sign-in only happens over HTTPS)
      # - DASH_HSTS=1            # tell browsers to always use https:// for this name. Only if nothing else
      #                          # on the same host name uses plain http:// (HSTS covers every port)
      # - DASH_UPLOAD_MAX_GB=10  # largest single upload; leave out for no limit
      # - DASH_TRASH_DAYS=30     # days deleted files stay in the bin
      # - TZ=Europe/London       # only if the machine has no /etc/timezone; used for scheduled restarts

      # Behind a reverse proxy (Caddy, nginx, Traefik). Only requests from these addresses may say who the
      # visitor really is (X-Forwarded-For) or that they came over HTTPS (X-Forwarded-Proto):
      # - DASH_TRUSTED_PROXY=127.0.0.1
      # Let the proxy sign people in (Authelia, Authentik, oauth2-proxy). It must set this header itself and
      # remove any copy the visitor sends. Names with a LabKeel account get that account's role; others need
      # to be listed here ("*" lets everyone the proxy signs in view):
      # - DASH_AUTH_HEADER=Remote-User
      # - DASH_PROXY_ADMINS=alice
      # - DASH_PROXY_VIEWERS=*

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # list, start, stop and restart containers
      - ./data:/data                                # accounts, settings, sign-in keys, history
      - ./config:/config                            # config.json (copy config.example.json there)
      - ./certs:/certs                              # HTTPS certificates
      # Folders to show in the file browser: one line each, under /browse.
      # Add :ro to the end of a line to make that folder read-only.
      - /srv/media:/browse/media
      # - /home/you/documents:/browse/documents:ro
