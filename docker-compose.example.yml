# Copy this file to docker-compose.yml, change what's marked, then run:  docker compose up -d --build
# Open https://<this machine's address>:8787 and follow the set-up page. It asks for a one-time code
# from the log:  docker logs labkeel

services:
  labkeel:
    build: .                                  # builds from this folder (docker compose up -d --build)
    # image: ghcr.io/smfstr1/labkeel:latest   # If this line is hashed, this file is a part of an Alpah release. Once releases are published: use this line instead of build
    container_name: labkeel
    restart: unless-stopped
    stop_grace_period: 30s                    # time to finish what it's doing (an upload, a move) before stopping

    # Docker keeps a container's log forever unless told otherwise: keep the last 3 × 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Docker Container Settings
    network_mode: host      #   network_mode: host  shows the machine's real network cards and traffic, not the container's
    pid: host               #   privileged: true    lets it read drive health (SMART) and run ZFS and disk commands on the machine
    privileged: true        #   pid: host           lets it see every process, and restart or shut down the machine if you allow it

    environment:
      - DASH_FILES_WRITE=0      # 1 = upload, edit, move and delete files in the file browser
      - DASH_ZFS_WRITE=0        # 1 = create, change and destroy ZFS pools, datasets and snapshots
      - DASH_ALLOW_REBOOT=0     # 1 = restart and shut down the machine

    # Optional Environment Settings
      # - DASH_PORT=8787         # Specify a port for the host to run at. 
      # - DASH_TLS=auto          # auto | tailscale | self-signed | off (off = plain HTTP behind your own HTTP proxy, which then needs DASH_TRUSTED_PROXY: sign-in only happens over HTTPS)
      # - DASH_HSTS=1            # tell browsers to always use https:// for this name. Only if nothing else on the same host name uses plain http:// (HSTS covers every port)
      # - DASH_UPLOAD_MAX_GB=10  # largest single upload; leave hashed for no limit
      # - DASH_TRASH_DAYS=30     # days deleted files stay in the bin
      # - TZ=Europe/London       # only if the machine has no /etc/timezone; used for scheduled restarts

      # Behind a reverse proxy (Caddy, nginx, Traefik). Only requests from these addresses may say who the
      # visitor really is (X-Forwarded-For) or that they came over HTTPS (X-Forwarded-Proto):
      # - DASH_TRUSTED_PROXY=127.0.0.1

      # Let the proxy sign people in (Authelia, Authentik, oauth2-proxy). It must set this header itself and
      # remove any copy the visitor sends. Names with a LabKeel account get that account's role; others need
      # to be listed here ("*" lets everyone the proxy signs in view):
      # - DASH_AUTH_HEADER=Remote-User
      # - DASH_PROXY_ADMINS=alice
      # - DASH_PROXY_VIEWERS=*

    # Volume Settings
    #
    # Format:
    # <Directory>:<Translation>
    #
    # Too add Folders to LabKeel's File Browser, list them under /browse.
    # e.g. /mnt/media:/browse/media
    # e.g. /srv/home/sam/Photos:/browse/familyphotos
    #
    # Add :ro to the end of a line to make that folder read-only.
    # Add :rw to the end of a line to make that folder read-write.
    # e.g. /mnt/media:/browse/media:ro
    # e.g. /srv/home/sam/Photos:/browse/familyphotos:rw
    
    volumes:
      # Required Volumes
      - /var/run/docker.sock:/var/run/docker.sock   # list, start, stop and restart containers
      - ./data:/data                                # accounts, settings, sign-in keys, history
      - ./config:/config                            # config.json (copy config.example.json there)
      - ./certs:/certs                              # HTTPS certificates

      # All Shown Volumes (Media is an Example)
      - /srv/media:/browse/media
