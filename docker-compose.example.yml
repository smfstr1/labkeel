# Copy this file to docker-compose.yml, change what's marked, then run:  docker compose up -d
# Open https://<this machine's address>:8787 afterwards.

services:
  dashboard:
    image: ghcr.io/OWNER/homelab-dashboard:latest   # or build it yourself: replace this line with  build: .
    container_name: homelab-dashboard
    restart: unless-stopped

    # Why these three are needed:
    #   network_mode: host  shows the machine's real network cards and traffic, not the container's
    #   pid: host           lets it see every process, and restart or shut down the machine if you allow it
    #   privileged: true    lets it read drive health (SMART) and run ZFS and disk commands on the machine
    # Together they give the dashboard full control of this machine. Only run it where you'd
    # be comfortable giving someone with the dashboard password a root shell.
    network_mode: host
    pid: host
    privileged: true

    environment:
      # Sign-in. Change both. A long password: this account can control the whole machine.
      - DASH_USER=admin
      - DASH_PASS=change-me-to-a-long-password

      # What the dashboard may change. Set any of these to 0 to make that part read-only.
      - DASH_ALLOW_REBOOT=1     # restart and shut down the machine
      - DASH_ZFS_WRITE=1        # create, change and destroy ZFS pools, datasets and snapshots
      - DASH_FILES_WRITE=1      # upload, edit, move and delete files in the file browser

      # Optional
      # - DASH_PORT=8787
      # - DASH_TLS=auto          # auto | tailscale | self-signed | off (off = plain HTTP behind your own proxy)
      # - DASH_TRUSTED_PROXY=    # with DASH_TLS=off: your reverse proxy's address
      # - DASH_UPLOAD_MAX_GB=10  # largest single upload; leave out for no limit
      # - DASH_TRASH_DAYS=30     # days deleted files stay in the bin
      # - TZ=Europe/London       # only if the machine has no /etc/timezone; used for scheduled restarts

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # list, start, stop and restart containers
      - ./data:/data                                # settings, sign-in keys, history
      - ./config:/config                            # config.json (copy config.example.json there)
      - ./certs:/certs                              # HTTPS certificates
      # Folders to show in the file browser: one line each, under /browse.
      # Add :ro to the end of a line to make that folder read-only.
      - /srv/media:/browse/media
      # - /home/you/documents:/browse/documents:ro
