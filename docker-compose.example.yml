# Copy this file to docker-compose.yml, change what's marked, then run:  docker compose up -d --build
# Open https://<this machine's address>:8787 and follow the set-up page. It asks for a one-time code
# from the log:  docker logs labkeel

services:
  labkeel:
    build: .                                  # builds from this folder (docker compose up -d --build)
    # image: ghcr.io/smfstr1/labkeel:latest   # once releases are published: use this line instead of build
    container_name: labkeel
    restart: unless-stopped
    stop_grace_period: 30s                    # time to finish what it's doing (an upload, a move) before stopping

    # Docker keeps a container's log forever unless told otherwise: keep the last 3 × 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Why these three are needed:
    #   network_mode: host  shows the machine's real network cards and traffic, not the container's
    #   pid: host           lets it see every process, and restart or shut down the machine if you allow it
    #   privileged: true    lets it read drive health (SMART) and run ZFS and disk commands on the machine
    # Together they give LabKeel full control of this machine. Only give an admin account to someone
    # you'd trust with a root shell on it.
    network_mode: host
    pid: host
    privileged: true

    environment:
      # ---- What LabKeel may change on this machine. All start off: turn on only what you need. ----
      - LABKEEL_ALLOW_FILE_CHANGES=0   # 1 = upload, edit, move and delete files in the file browser
      - LABKEEL_ALLOW_ZFS_CHANGES=0    # 1 = create, change and destroy ZFS pools, datasets and snapshots
      - LABKEEL_ALLOW_RESTART=0        # 1 = restart and shut down the machine

      # ---- Sign-in ----
      # Accounts are made on the set-up page and the Account page, so nothing is needed here.
      # Or set one admin here instead (it can't then be changed from the dashboard). Make the hash with
      #   docker exec -it labkeel python accounts.py hash
      # and write each $ in it as $$ in this file:
      # - LABKEEL_ADMIN_USER=admin
      # - LABKEEL_ADMIN_PASSWORD_HASH=$$argon2id$$v=19$$...

      # ---- Optional ----
      # - LABKEEL_PORT=8787            # the port to open in your browser
      # - LABKEEL_HTTPS=auto           # auto | tailscale | self-signed | off
      #                                #   off = plain HTTP behind your own HTTPS proxy, which then needs
      #                                #   LABKEEL_TRUSTED_PROXY below (LabKeel only signs people in over HTTPS)
      # - LABKEEL_HSTS=1               # tell browsers to always use https:// for this name. Only if nothing else
      #                                #   on the same name uses plain http:// (it covers every port)
      # - LABKEEL_UPLOAD_LIMIT_GB=10   # largest single upload (leave out for no limit)
      # - LABKEEL_BIN_DAYS=30          # days deleted files stay in the Bin
      # - TZ=Europe/London             # only if the machine has no /etc/timezone (used for scheduled restarts)

      # ---- Behind a reverse proxy (Caddy, nginx, Traefik) ----
      # Only requests from these addresses may say who the visitor is (X-Forwarded-For) or that they came
      # over HTTPS (X-Forwarded-Proto):
      # - LABKEEL_TRUSTED_PROXY=127.0.0.1
      # Let the proxy sign people in (Authelia, Authentik, oauth2-proxy). It must set this header itself and
      # remove any copy the visitor sends. Names with a LabKeel account get that account's role; others need
      # listing here ("*" lets everyone the proxy signs in view):
      # - LABKEEL_PROXY_USER_HEADER=Remote-User
      # - LABKEEL_PROXY_ADMINS=alice
      # - LABKEEL_PROXY_VIEWERS=*
      #
      # Every setting is described in docs/settings.md. Names from before 0.1.2 (DASH_...) still work.

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # list, start, stop and restart containers
      - ./data:/data                                # accounts, settings, sign-in keys, history
      - ./config:/config                            # config.json (copy config.example.json there)
      - ./certs:/certs                              # HTTPS certificates
      # Folders to show in the file browser: one line each, under /browse.
      # Add :ro to the end of a line to make that folder read-only.
      - /srv/media:/browse/media
      # - /home/you/documents:/browse/documents:ro
